services:
  - type: web
    name: takemeter-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://takemeter-web.onrender.com
    healthCheckPath: /api/health

  - type: web
    name: takemeter-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://takemeter-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
